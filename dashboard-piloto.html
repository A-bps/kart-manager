<!DOCTYPE html>
<html lang="pt-BR" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speed Park — Cockpit do Piloto</title>
  <script>(function(){var t=localStorage.getItem('sp_tema');if(t==='light')document.documentElement.classList.remove('dark');else document.documentElement.classList.add('dark');})()</script>
  <link rel="icon" type="image/png" href="./src/assets/images/LogoSpeedPark.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Anybody:ital,wght@0,100..900;1,100..900&family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
    rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'surface': '#051424', 'surface-dim': '#051424', 'surface-bright': '#2c3a4c',
            'surface-container-lowest': '#010f1f', 'surface-container-low': '#0d1c2d',
            'surface-container': '#122131', 'surface-container-high': '#1c2b3c',
            'surface-container-highest': '#273647', 'surface-variant': '#273647',
            'background': '#051424', 'on-surface': '#d4e4fa', 'on-surface-variant': '#e3bdc2',
            'primary': '#ffb2bd', 'primary-container': '#d91e5b', 'on-primary-container': '#fff4f4',
            'secondary': '#9bccf6', 'secondary-container': '#134d71', 'on-secondary-container': '#8dbee7',
            'tertiary': '#bec6e0', 'tertiary-container': '#687087',
            'error': '#ffb4ab', 'error-container': '#93000a', 'on-error-container': '#ffdad6',
            'outline': '#aa888c', 'outline-variant': '#5b4043',
          },
          fontFamily: {
            'display-hero': ['Anybody', 'sans-serif'],
            'headline-lg': ['Anybody', 'sans-serif'], 'headline-md': ['Anybody', 'sans-serif'],
            'headline-sm': ['Anybody', 'sans-serif'], 'body-lg': ['Hanken Grotesk', 'sans-serif'],
            'body-md': ['Hanken Grotesk', 'sans-serif'], 'body-sm': ['Hanken Grotesk', 'sans-serif'],
            'label-caps': ['Hanken Grotesk', 'sans-serif'], 'label-data': ['JetBrains Mono', 'monospace'],
          },
          fontSize: {
            'display-hero': ['72px', { lineHeight: '1.1', letterSpacing: '-0.04em', fontWeight: '800' }],
            'headline-lg': ['40px', { lineHeight: '1.2', letterSpacing: '-0.02em', fontWeight: '700' }],
            'headline-md': ['32px', { lineHeight: '1.2', fontWeight: '700' }],
            'headline-sm': ['24px', { lineHeight: '1.3', fontWeight: '600' }],
            'body-lg': ['18px', { lineHeight: '1.6', fontWeight: '400' }],
            'body-md': ['16px', { lineHeight: '1.6', fontWeight: '400' }],
            'body-sm': ['14px', { lineHeight: '1.5', fontWeight: '400' }],
            'label-data': ['14px', { lineHeight: '1', letterSpacing: '0.05em', fontWeight: '500' }],
            'label-caps': ['12px', { lineHeight: '1', letterSpacing: '0.1em', fontWeight: '700' }],
          },
          spacing: { 'gutter': '24px', 'margin-edge': '32px' },
          maxWidth: { 'container-max': '1440px' },
        }
      }
    }
  </script>

  <link rel="stylesheet" href="./style.css" />
  <style>
    .skew-10  { transform: skewX(-10deg); }
    .unskew-10 { transform: skewX(10deg); }
    .hard-offset { box-shadow: 4px 4px 0px 0px var(--shadow-color, rgba(217,30,91,0.25)); }
    input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.8); cursor: pointer; }
    input[type="date"] { background-color: #051424; }
  </style>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body class="bg-background text-on-background font-body-md overflow-x-hidden">
  <div id="root"></div>
  <script type="text/babel" src="./dashboard-piloto.jsx"></script>
</body>

</html>
